# =============================================================
#  PC Optimizer Pro — конфигурация
#  Все значения можно менять; отсутствующие ключи берутся
#  из встроенных значений по умолчанию.
# =============================================================

schedule:
  # Времена поверхностной чистки (light = только очистка мусора)
  light_times:
    - "12:00"
  # Времена глубокой оптимизации (full = все 5 шагов)
  full_times:
    - "18:00"
  # Обратная совместимость: если списков light_times/full_times нет,
  # используется старый ключ times (все запуски = full).
  # Часовой пояс (None = локальное время системы).
  timezone: null
  # Догоняющий запуск: если ПК был выключен/спал в запланированное
  # время, выполнить пропущенные задачи сразу при следующем старте.
  catch_up_on_wake: true

cleaner:
  # Каталоги для очистки временных файлов. Поддерживается %TEMP%.
  temp_paths:
    - "%TEMP%"
    - "C:\\Windows\\Temp"
  clean_recycle_bin: true
  # Удалять ротированные лог-файлы старше N дней
  log_retention_days: 7

process_monitor:
  # Пороги для определения "тяжёлых" процессов (%)
  cpu_threshold_percent: 50.0
  ram_threshold_percent: 50.0
  # Сколько минут пользователь должен быть неактивен (idle),
  # чтобы закрывать нежелательные процессы.
  idle_minutes: 10
  # Процессы, которые разрешено закрывать при простое.
  # Закрываются ТОЛЬКО перечисленные здесь имена (регистр не важен).
  unwanted_processes:
    - "gamebar.exe"
    - "your_helper_app.exe"

power:
  # Схема питания для каждого сценария (имя из списка schemes ниже).
  # Доступные: high_performance | balanced | power_saver | ultimate
  game_scheme: "high_performance"
  office_scheme: "balanced"
  idle_scheme: "power_saver"
  # Процессы, сигнализирующие об активной игре -> game_scheme
  # (лаунчеры вроде steam.exe сюда не добавляйте: висят в фоне и «залипают»
  #  на схеме высокой производительности)
  game_processes:
    - "cs2.exe"
    - "dota2.exe"
  # Офисные процессы -> office_scheme
  office_processes:
    - "WINWORD.EXE"
    - "EXCEL.EXE"
    - "POWERPNT.EXE"
  # Лаунчеры, которые сами по себе игру НЕ включают (агент питания их игнорирует)
  launchers_to_ignore:
    - "steam.exe"
    - "epicgameslauncher.exe"
    - "battle.net.exe"
  # «Тяжёлые» задачи (рендеринг, компиляция, кодирование) -> high_performance
  heavy_task_processes:
    - "blender.exe"
    - "ffmpeg.exe"
    - "cl.exe"
  # GUID схем электропитания. Ultimate Performance доступна не на всех ПК —
  # при недоступности программа откатится на high_performance.
  schemes:
    high_performance: "8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c"
    balanced: "381b4222-f694-41f0-9685-ff5bb260df2e"
    power_saver: "a1841308-3541-4fab-bc81-f71556f20b4a"
    ultimate: "e9a42b02-d5df-448d-aa00-03f14749eb61"

# =============================================================
#  Фоновый агент питания
#  Постоянно следит за контекстом (игра/офис/нагрузка/простой)
#  и сам переключает схему электропитания. По умолчанию выключен.
# =============================================================
power_agent:
  enabled: false
  # Интервал проверки состояния, секунды
  interval_seconds: 10
  # Минимальное время «удержания» игры перед переключением обратно, секунды
  # (гистерезис: игра закрылась -> схема меняется не раньше чем через это время)
  game_cooldown_seconds: 180
  # Какая схема применяется для каждого контекста
  context_map:
    game: "high_performance"
    heavy: "high_performance"
    office: "balanced"
    idle: "power_saver"

defrag:
  # Диски для анализа и дефрагментации (только HDD!)
  drives:
    - "C:"

# =============================================================
#  Расширенные функции оптимизации
#  ВАЖНО: все изменяющие действия по умолчанию ВЫКЛЮЧЕНЫ.
#  Модули сначала собирают данные и меняют систему только по
#  явному разрешению ниже.
# =============================================================

startup:
  # Анализ автозагрузки (реестр Run/RunOnce + папка «Автозагрузка»)
  enabled: true
  # Имена записей, которые разрешено отключать.
  # Отключение обратимо: значение реестра переносится в резервный ключ,
  # файл из папки «Автозагрузка» — в подпапку disabled.
  disable_entries: []
  #  - "SomeUpdater"

services:
  # Управление службами. По умолчанию только анализ.
  enabled: false
  # Службы, которые разрешено переводить в ручной запуск (Manual).
  # Критические службы защищены встроенным списком и всё равно не тронуты.
  disable_services: []
  #  - "DiagTrack"
  protected_services: []

network:
  # Сетевые настройки. По умолчанию только безопасный сброс DNS-кэша.
  enabled: false
  flush_dns: true
  # Смена DNS-серверов (текущие значения сохраняются для отката)
  set_dns: false
  dns_servers: []
  #  - "1.1.1.1"
  #  - "8.8.8.8"
  # TCP-тюнинг (autotuninglevel, rss, heuristics) с сохранением прежних значений
  tune_tcp: false

disk_health:
  # SMART и свободное место — только чтение, безопасно
  enabled: true
  # Предупреждать, если свободно меньше указанного процента
  warn_free_percent: 10.0

duplicates:
  # Поиск больших файлов и дубликатов. По умолчанию выключено:
  # сканирование может занимать заметное время.
  enabled: false
  # Каталоги для сканирования (пусто = ничего не сканировать)
  scan_paths: []
  #  - "%USERPROFILE%\\Downloads"
  # Минимальный размер файла-кандидата, МБ
  min_size_mb: 10
  # Искать дубликаты по содержимому (размер + SHA-256)
  find_duplicates: true
  # УДАЛЕНИЕ дубликатов. Оставьте false, чтобы получать только отчёт.
  # При true удаляются все копии, кроме самой старой.
  delete_duplicates: false
  # Ограничение числа просматриваемых файлов (защита от долгого сканирования)
  max_files: 20000

winget:
  # Обновления пакетов через winget. По умолчанию только список доступных.
  enabled: false
  # true = выполнять winget upgrade --all (список обновлённого — в logs/state.json)
  upgrade_all: false

thermal:
  # Температура и троттлинг — только чтение
  enabled: true
  # Температура, выше которой пишется предупреждение, °C
  max_temperature_c: 85
  # Если текущая частота CPU ниже указанного процента от максимальной,
  # это считается признаком троттлинга
  min_clock_percent: 60
  # Разрешить реагировать сменой схемы питания на «Экономия энергии»
  switch_to_power_saver: false

drivers:
  # Папка с заранее подготовленными .inf драйверами для установки через pnputil
  driver_folder: "C:\\Drivers"
  # Автоматическое обновление через winget / UsoClient
  enable_driver_update: false
  # Способ обновления: "winget" или "uso"
  update_tool: "winget"

logging:
  level: "TRACE"      # TRACE | DEBUG | INFO | WARNING | ERROR
  dir: "logs"
  generate_report: true   # писать текстовый отчёт о выполненной оптимизации
